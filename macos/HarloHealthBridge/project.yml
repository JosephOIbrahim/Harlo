# xcodegen spec for HarloHealthBridge (Phase 5B).
#
# Generate the Xcode project on demand:
#     brew install xcodegen
#     cd macos/HarloHealthBridge && xcodegen generate
#
# The generated HarloHealthBridge.xcodeproj is gitignored so we don't
# commit pbxproj noise. CI regenerates fresh every build.
#
# Builds an LSUIElement=true app bundle that owns the HealthKit
# entitlement, pushes deltas to the Harlo daemon over UDS, and stays
# out of the way otherwise (ADR-0001).

name: HarloHealthBridge

options:
  bundleIdPrefix: com.harlo
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Release
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "233JSS4X69"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    PRODUCT_NAME: HarloHealthBridge
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Universal binary so Intel + Apple Silicon both work
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO

targets:
  HarloHealthBridge:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/HarloHealthBridge
        excludes:
          - "*.entitlements"
          - "*.md"
      - path: Resources
    # No `info:` block on purpose: xcodegen REGENERATES (clobbers) Info.plist
    # when one is present, stripping NSHealthShareUsageDescription + LSUIElement.
    # We point the build at the on-disk Info.plist via INFOPLIST_FILE instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harlo.healthbridge
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/HarloHealthBridge/HarloHealthBridge.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: NO
    dependencies:
      - target: HarloXPCRelay
        copy:
          destination: wrapper
          subpath: Contents/Helpers
        codeSign: true

  HarloXPCRelay:
    # XPC relay (ADR-0001 Phase 5B): a non-sandboxed launchd Mach service that
    # forwards biometric samples from the sandboxed bridge to the daemon socket.
    # Built + signed by this project and embedded into
    # HarloHealthBridge.app/Contents/Helpers/ (where com.harlo.xpc.plist expects it).
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ../HarloXPCRelay
    settings:
      base:
        PRODUCT_NAME: HarloXPCRelay
        PRODUCT_BUNDLE_IDENTIFIER: com.harlo.xpcrelay
        SKIP_INSTALL: YES

schemes:
  HarloHealthBridge:
    build:
      targets:
        HarloHealthBridge: all
    run:
      config: Debug
    archive:
      config: Release
