[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "harlo"
version = "0.1.6"
description = "Harlo — local-first AI coach, aware of your physical state, with a USD-composed cognitive twin: native composition priority, structural-lossless reconstruction, anchor immunity. Patent Pending."
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "jsonschema>=4.0",
    "numpy>=1.26",
    "maturin>=1.5",
    "mcp>=1.0",
    "onnxruntime>=1.17",
    "transformers>=4.36",
    "pydantic>=2.0",
    "networkx>=3.0",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.scripts]
harlo = "harlo.mcp_server:main"

[project.optional-dependencies]
# Path C codeless schema substrate (real OpenUSD via pip-installable usd-core).
# Activates the persistence-layer code paths (schema/, persistence/, sync/).
# Core Harlo runs without this extra (Constitution Law 3 — pxr stays optional).
# Pin rationale: harness/path_c/substrate_pin.md.
substrate = [
    "usd-core>=24.05",
]

# Test-suite dependencies. Required to collect+run the full pytest baseline.
# Evidence basis (Mile 2 Phase A):
#   sentence_transformers — python/harlo/encoder/semantic_encoder.py:13
#   anthropic             — python/harlo/provider/claude.py:11
#   pytest                — runner; pinned here so the [dev] install is self-contained
# Excluded from [dev]: openai (provider/openai.py uses lazy/stub-fallback import).
# Rationale captured in harness/path_c/baseline_resolution.md.
dev = [
    "sentence_transformers",
    "anthropic",
    "pytest",
]

[tool.maturin]
manifest-path = "crates/hippocampus/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "harlo.hippocampus"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "src", "tests"]
extend-exclude = ["build", "dist", ".venv312", ".venv314", "data"]

[tool.ruff.lint]
# Conservative to start: pyflakes (F) + high-signal pycodestyle subsets.
# Expand over time; the Rust hot path is covered by `cargo clippy`.
select = ["E4", "E7", "E9", "F"]